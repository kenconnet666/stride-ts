# CI：每次推送 main、每个 PR 跑（分层测试的第 3 层：本地只跑快检和改动影响到的样例，全量在这里）。
# GitHub 自带的运行器没有显卡，WebGPU 用 Chrome 带的 SwiftShader（软件，Linux 上才有）：冒烟的功能检查和预算里的计数都验证得了，
# 帧时间、和桌面 Stride 的截图比对、测量在本地的验证工作树里跑（tools/verify.ps1 槽位 3）。
name: CI

on:
  # 只改文档的不跑（同一分支上新的推送会取消正在跑的，文档的推送不该把它打断）
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# PR 上新的推送取消旧的运行；main 上几路会话都在推，每次都跑完（不然一直被下一次推送打断，全量永远跑不完）
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 样例的内容从用户 fork 的 Stride 导入（这个分支的样例换成了 BepuPhysics 的组件，见 docs/handover.md）
  STRIDE_FORK: https://github.com/kenconnet666/stride
  STRIDE_BRANCH: web-experiment-base

jobs:
  # 第 1 层：类型检查和单测
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # 导入样例的内容（apps/*/public/content，不提交）：导入器、样例的导入脚本、依赖和 Stride 的提交都没变时用缓存
  content:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: Content cache key
        id: key
        run: |
          stride=$(git ls-remote "$STRIDE_FORK" "refs/heads/$STRIDE_BRANCH" | cut -f1)
          echo "stride=$stride" >> "$GITHUB_OUTPUT"
          echo "key=content-${{ hashFiles('packages/pipeline/src/**', 'packages/engine/src/content/**', 'apps/*/scripts/import.ts', 'apps/*/content-overrides/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-$stride" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cached
        with:
          path: apps/*/public/content
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: pnpm/action-setup@v4
        if: steps.cached.outputs.cache-hit != 'true'
      - uses: actions/setup-node@v4
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Stride 的样例：稀疏、浅克隆，只拉 samples 和导入器要的引擎自带资源包（packages/pipeline/src/cli.ts 的 STRIDE_PACKAGES）的 LFS 文件（约 190 MB）；LFS 对象按 Stride 的提交另外缓存，导入器改了也不用重新下
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Check out the Stride samples
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b "$STRIDE_BRANCH" "$STRIDE_FORK" "$RUNNER_TEMP/stride"
          git -C "$RUNNER_TEMP/stride" sparse-checkout set samples sources/engine/Stride.Engine/AssetPackage sources/plugins/UI/Stride.UI.Assets
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/stride/.git/lfs
          key: stride-lfs-${{ steps.key.outputs.stride }}
      - if: steps.cached.outputs.cache-hit != 'true'
        run: git -C "$RUNNER_TEMP/stride" lfs pull --include "samples/**,sources/engine/Stride.Engine/AssetPackage/**,sources/plugins/UI/Stride.UI.Assets/**"
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Import
        env:
          STRIDE_REPO: ${{ runner.temp }}/stride
        run: pwsh tools/import-all.ps1 -Parallel 2
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/*/public/content
          key: ${{ steps.key.outputs.key }}

  # 第 3 层：全部样例的冒烟（软件 WebGPU），四组在四台运行器上同时跑；按本地的耗时分得差不多
  smoke:
    needs: content
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        apps:
          - csharp-intermediate,sprite-fonts,platformer,simple-audio,material-shader
          - topdown-rpg,first-person-shooter,jumpy-jet,space-escape,custom-effect
          - bepu-sample,ui-element-link,platformer2d,morph-targets,animated-model
          - csharp-beginner,particles-sample,physics-sample,ui-particles,game-menu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v4
        with:
          path: apps/*/public/content
          key: ${{ needs.content.outputs.key }}
          fail-on-cache-miss: true
      - name: Smoke
        # --use-vulkan=swiftshader 不能少：Linux 上 Chrome 合成用 GL（ANGLE 的 SwiftShader）、Dawn 用 Vulkan 时，WebGPU 画布的交换链贴图要两边
        # 共用一份内存（外部内存对象），SwiftShader 的 GL 不支持，GPU 进程建不出这张贴图（chrome.log 里"Could not find SharedImageBackingFactory
        # … WebgpuSwapChainTexture"），WebGPU 的上下文随之丢掉，页面里就是"A valid external Instance reference no longer exists"。让 Chrome 自己的
        # Vulkan 也用 SwiftShader，交换链贴图走 Vulkan 的后端（ExternalVkImageBacking）。
        # 画面用默认的 1280x720：冒烟的点击坐标、UI 的布局（GameMenu 的虚拟分辨率跟着后备缓冲走）都是按这个大小写的
        env:
          STRIDE_CHROME_ARGS: --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader
        run: pwsh tools/regress.ps1 -Apps "${{ matrix.apps }}" -Parallel 2
      # 失败时看机器的内存、共享内存和有没有进程被 OOM 杀掉（GPU 进程没了，页面里只看得到"Instance reference no longer exists"）
      - name: Machine state
        if: failure()
        run: |
          free -m
          df -h /dev/shm
          sudo dmesg | grep -i -E 'killed process|out of memory|oom' || true
