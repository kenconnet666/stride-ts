# CI：每次推送 main、每个 PR 跑（分层测试的第 3 层：本地只跑快检和改动影响到的样例，全量在这里）。
# GitHub 自带的运行器没有显卡，WebGPU 用 Chrome 带的 SwiftShader（软件，Linux 上才有）：冒烟的功能检查和预算里的计数都验证得了，
# 帧时间、和桌面 Stride 的截图比对、测量在本地的验证工作树里跑（tools/verify.ps1 槽位 3）。
name: CI

on:
  # 只改文档的不跑（同一分支上新的推送会取消正在跑的，文档的推送不该把它打断）
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

# PR 上新的推送取消旧的运行。main 上几路会话都在推：正在跑的跑完（不然一直被下一次推送打断，全量永远跑不完），排队的只留最新的
# 一次（GitHub 的并发组里新排进来的顶掉还没开始的），一次运行有二十多个作业，每次推送都跑会把运行器排满
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 样例的内容从用户 fork 的 Stride 导入（这个分支的样例换成了 BepuPhysics 的组件，见 docs/handover.md）
  STRIDE_FORK: https://github.com/kenconnet666/stride
  STRIDE_BRANCH: web-experiment-base

jobs:
  # 第 1 层：类型检查和单测
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # 导入样例的内容（apps/*/public/content，不提交）：导入实际读到的文件（tools/content-key.ts：导入器、它 import 的引擎文件、样例的导入脚本、
  # 内容的覆盖文件、锁文件）和 Stride 的提交都没变时用缓存。顺带列出有冒烟脚本的样例给 smoke 的矩阵
  content:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      apps: ${{ steps.key.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Content cache key
        id: key
        run: |
          stride=$(git ls-remote "$STRIDE_FORK" "refs/heads/$STRIDE_BRANCH" | cut -f1)
          echo "stride=$stride" >> "$GITHUB_OUTPUT"
          echo "key=content-$(node tools/content-key.ts)-$stride" >> "$GITHUB_OUTPUT"
          echo "apps=$(ls apps/*/scripts/smoke.ts | cut -d/ -f2 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cached
        with:
          path: apps/*/public/content
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - uses: pnpm/action-setup@v6
        if: steps.cached.outputs.cache-hit != 'true'
      - if: steps.cached.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      # Stride 的样例：稀疏、浅克隆，只拉 samples 和导入器要的引擎自带资源包（packages/pipeline/src/cli.ts 的 STRIDE_PACKAGES）的 LFS 文件（约 190 MB）；LFS 对象按 Stride 的提交另外缓存，导入器改了也不用重新下
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Check out the Stride samples
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b "$STRIDE_BRANCH" "$STRIDE_FORK" "$RUNNER_TEMP/stride"
          git -C "$RUNNER_TEMP/stride" sparse-checkout set samples sources/engine/Stride.Engine/AssetPackage sources/plugins/UI/Stride.UI.Assets
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/stride/.git/lfs
          key: stride-lfs-${{ steps.key.outputs.stride }}
      - if: steps.cached.outputs.cache-hit != 'true'
        run: git -C "$RUNNER_TEMP/stride" lfs pull --include "samples/**,sources/engine/Stride.Engine/AssetPackage/**,sources/plugins/UI/Stride.UI.Assets/**"
      - if: steps.cached.outputs.cache-hit != 'true'
        name: Import
        env:
          STRIDE_REPO: ${{ runner.temp }}/stride
        run: pwsh tools/import-all.ps1 -Parallel 2
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/*/public/content
          key: ${{ steps.key.outputs.key }}

  # 第 3 层：全部样例的冒烟（软件 WebGPU），一个样例一台运行器（公开仓库的运行器不计时长）：SwiftShader 在 4 核的运行器上画
  # 1280x720 一帧要几百毫秒，两个样例抢一台时有的冒烟一帧都走不动
  smoke:
    needs: content
    runs-on: ubuntu-latest
    name: smoke (${{ matrix.app }})
    # 最慢的样例（csharp-intermediate）在软件 WebGPU 上过了的时候也要 12～29 分钟（随运行器的快慢）；卡住的冒烟不设上限会占满
    # GitHub 默认的 6 小时，main 上后面的推送都排在它后面（并发组不取消正在跑的）。regress.ps1 在 CI 上每个样例 2400 秒为止
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.content.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache/restore@v6
        with:
          path: apps/*/public/content
          key: ${{ needs.content.outputs.key }}
          fail-on-cache-miss: true
      # 手搭的工程（collect-dodge、short-film、greybox、campsite）的内容是提交在仓库里的：缓存的键只看导入器的输入，它们改了键不变，
      # 恢复缓存会拿旧的盖掉刚检出的。按仓库里的还原回来（导入的、不提交的文件不受影响）
      - name: Restore committed content
        run: git restore --source=HEAD --worktree -- ':(glob)apps/*/public/content/**'
      - name: Smoke
        # --use-vulkan=swiftshader 不能少：Linux 上 Chrome 合成用 GL（ANGLE 的 SwiftShader）、Dawn 用 Vulkan 时，WebGPU 画布的交换链贴图要两边
        # 共用一份内存（外部内存对象），SwiftShader 的 GL 不支持，GPU 进程建不出这张贴图（chrome.log 里"Could not find SharedImageBackingFactory
        # … WebgpuSwapChainTexture"），WebGPU 的上下文随之丢掉，页面里就是"A valid external Instance reference no longer exists"。让 Chrome 自己的
        # Vulkan 也用 SwiftShader，交换链贴图走 Vulkan 的后端（ExternalVkImageBacking）。
        # 画面用默认的 1280x720：冒烟的点击坐标、UI 的布局（GameMenu 的虚拟分辨率跟着后备缓冲走）都是按这个大小写的
        # 软件 WebGPU 上一帧零点几秒到一秒：冒烟里按帧、按游戏时间等的命令给 300 秒（本机默认 120 秒）
        env:
          STRIDE_CHROME_ARGS: --enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader
          STRIDE_TIMEOUT: '300'
          # 最慢的两个样例（csharp-intermediate 30 分钟、csharp-beginner 14 分钟）按半分辨率画：CSS 的大小、点击坐标不变，
          # 片元少四倍（它们的冒烟不看像素）
          STRIDE_DPR: ${{ (matrix.app == 'csharp-intermediate' || matrix.app == 'csharp-beginner') && '0.5' || '1' }}
        run: pwsh tools/regress.ps1 -Apps ${{ matrix.app }} -Parallel 1
